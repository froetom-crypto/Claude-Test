name: Bildquellen und Modelle prüfen (vorübergehend)
on:
  push:
    branches: [ccr-2fb6385d-mau7ew]
    paths: ['.github/workflows/quellen-test.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Bildquellen (Status, CORS, Antwort)
        run: |
          O="Origin: https://froetom-crypto.github.io"
          for u in \
            "https://api.openverse.org/v1/images/?q=red%20cat%20window&page_size=3" \
            "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrsearch=red%20cat%20window&gsrlimit=3&prop=imageinfo&iiprop=url&iiurlwidth=640" \
            ; do
            echo "=================== $u"
            curl -sS -m 30 -H "$O" -D /tmp/h -o /tmp/b "$u" || true
            grep -iE "^HTTP|access-control-allow-origin" /tmp/h || true
            head -c 700 /tmp/b; echo
          done
      - name: Modelle auf Hugging Face
        run: |
          for m in onnx-community/siglip2-base-patch16-224-ONNX onnx-community/siglip2-base-patch16-256-ONNX Xenova/siglip-base-patch16-224 Xenova/clip-vit-base-patch16 Xenova/clip-vit-large-patch14 jinaai/jina-clip-v2 ; do
            echo "=================== $m"
            curl -sS -m 30 "https://huggingface.co/api/models/$m/tree/main/onnx" | python3 -c "import json,sys
          try:
            d=json.load(sys.stdin)
            print([(x['path'], round(x.get('size',0)/1e6)) for x in d] if isinstance(d,list) else d)
          except Exception as e: print('fehler', e)"
          done
      - name: Kostenlose KI ohne Schlüssel (Pollinations)
        run: |
          curl -sS -m 60 -H "Origin: https://froetom-crypto.github.io" -D /tmp/h -o /tmp/b https://text.pollinations.ai/openai \
            -H 'Content-Type: application/json' \
            -d '{"model":"openai","messages":[{"role":"user","content":[{"type":"text","text":"What animal is in this picture? One word."},{"type":"image_url","image_url":{"url":"https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg"}}]}]}' || true
          grep -iE "^HTTP|access-control-allow-origin" /tmp/h || true
          head -c 700 /tmp/b; echo
