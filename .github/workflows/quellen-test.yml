name: Bildquellen und Modelle prüfen (vorübergehend)
on:
  push:
    branches: [ccr-2fb6385d-mau7ew]
    paths: ['.github/workflows/quellen-test.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Openverse-Vorschaubild (CORS)
        run: |
          id=$(curl -sS "https://api.openverse.org/v1/images/?q=cat&page_size=1" | python3 -c "import json,sys;print(json.load(sys.stdin)['results'][0]['id'])")
          curl -sS -o /dev/null -D - -H "Origin: https://froetom-crypto.github.io" "https://api.openverse.org/v1/images/$id/thumb/" | grep -iE "^HTTP|access-control|content-type|location"
      - name: Pollinations-Modelle mit Bild-Eingabe
        run: |
          curl -sS -m 30 https://text.pollinations.ai/models | python3 -c "import json,sys
          d=json.load(sys.stdin)
          for m in d:
            print(m.get('name'), '| vision:', m.get('vision'), '| input:', m.get('input_modalities'), '| tier:', m.get('tier'), '|', (m.get('description') or '')[:60])"
      - name: Kostenlose KI ohne Schlüssel (Pollinations)
        run: |
          for model in openai-large gemini openai-fast mistral claude; do
          echo "=========== $model"
          curl -sS -m 60 -H "Origin: https://froetom-crypto.github.io" -D /tmp/h -o /tmp/b https://text.pollinations.ai/openai \
            -H 'Content-Type: application/json' \
            -d '{"model":"'$model'","messages":[{"role":"user","content":[{"type":"text","text":"What animal is in this picture? One word."},{"type":"image_url","image_url":{"url":"https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg"}}]}]}' || true
          grep -iE "^HTTP|access-control-allow-origin" /tmp/h || true
          head -c 400 /tmp/b; echo
          done
