name: Verspätungsstatistik sammeln

on:
  schedule:
    # krumme Minuten: GitHub verschiebt/überspringt Läufe zur vollen und Viertelstunde besonders oft
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bisherige Statistik holen
        run: |
          mkdir -p out
          if git fetch -q origin stats-data; then git show FETCH_HEAD:stats.json > out/stats.json || true; git show FETCH_HEAD:state.json > out/state.json || true; fi
      - name: Sammeln
        run: node collector/collect.mjs out/stats.json
      - name: Speichern (ein einziger Commit, alte Stände werden ersetzt)
        run: |
          cd out
          git init -q -b stats-data
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json state.json
          git commit -qm "Statistik $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:stats-data
