name: Live-Test (echter Browser, echte Daten)
on:
  workflow_dispatch:
  push:
    branches: [ccr-a176c7b3-u1epln]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rohdaten (Diagnose)
        run: |
          for ID in 'de-DELFI_de:05315:11201' 'de-DELFI_de:05315:11111:1:11' 'de-DELFI_de:09162:2'; do
          curl -sS -G "https://api.transitous.org/api/v1/stoptimes" --data-urlencode "stopId=$ID" --data-urlencode "n=60" --data-urlencode "time=$(date -u -d '-30 min' +%FT%TZ)" | python3 -c "
          import json,sys,collections
          d=json.load(sys.stdin); c=collections.Counter()
          for s in d.get('stopTimes',[]): c[(s.get('mode'),s.get('routeShortName'),s.get('agencyName'),s.get('agencyId'),(s.get('routeId') or '')[:40],s.get('tripId','')[:30])]+=1
          [print(k,v) for k,v in sorted(c.items(),key=str)[:60]]"
          echo ----; done
      - name: Sammler gegen Live-API (Probelauf, nichts wird gespeichert)
        run: node collector/collect.mjs /tmp/stats.json && node -e "const s=require('/tmp/stats.json');const S=require('./stats.js');for(const a of Object.values(s.lines).sort((x,y)=>S.summary(y).tot-S.summary(x).tot).slice(0,25)){const m=S.summary(a);console.log(a.product,a.name,a.agency,'n='+m.tot,'puenktlich='+(m.punct*100).toFixed(0)+'%','ausfall='+(m.cancel*100).toFixed(1)+'%')}"
      - name: App im echten Browser mit Live-Daten
        run: |
          npm i --no-save --silent playwright-core@1.48.2
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          node .github/e2e/e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: '*.png'
