name: diag
on:
  push:
    branches: [ccr-a176c7b3-u1epln]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          ID='de-DELFI_de:05315:11111:1:11'
          P=$(date -u -d '-60 min' +%Y-%m-%dT%H:%M:%SZ)
          for v in v1 v2 v3 v4 v5; do
            echo "=== stoptimes $v"; curl -sS -m 25 -G "https://api.transitous.org/api/$v/stoptimes" --data-urlencode "stopId=$ID" --data-urlencode "n=40" --data-urlencode "time=$P" -o st_$v.json -w '%{http_code}\n'; head -c 2500 st_$v.json; echo
            python3 - st_$v.json <<'PY'
          import json,sys
          try:
            d=json.load(open(sys.argv[1])); st=d.get('stopTimes',[])
            print('count',len(st),'keys',list(d.keys()))
            for s in st[:40]:
              p=s.get('place',{})
              print(s.get('routeShortName'),s.get('mode'),s.get('realTime'),s.get('cancelled'),p.get('scheduledDeparture'),p.get('departure'),s.get('agencyName'),s.get('headsign'))
          except Exception as e: print('ERR',e)
          PY
          done
          F='50.9357,6.9477'; T='50.9601,6.9574'
          A=$(date -u -d '+60 min' +%Y-%m-%dT%H:%M:%SZ)
          for v in v1 v2 v3 v4 v5; do echo "=== plan $v"; curl -sS -m 30 -G "https://api.transitous.org/api/$v/plan" --data-urlencode "fromPlace=$ID" --data-urlencode "toPlace=$T" --data-urlencode "time=$A" --data-urlencode "arriveBy=true" -w '\n%{http_code}\n' | head -c 3500; echo; done
          echo "=== EFA DM realtime"; curl -sS -m 25 "https://efa.vrr.de/standard/XML_DM_REQUEST?outputFormat=rapidJSON&type_dm=stop&name_dm=de:05315:11111&mode=direct&useRealtime=1&limit=5&itdDateTimeDepArr=dep" | head -c 3000
