name: diag
on:
  push:
    branches: [ccr-a176c7b3-u1epln]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for u in \
            "https://api.transitous.org/api/v1/geocode?text=K%C3%B6ln%20Neumarkt" \
            "https://efa.vrr.de/standard/XML_STOPFINDER_REQUEST?outputFormat=rapidJSON&type_sf=any&name_sf=K%C3%B6ln%20Neumarkt&anyMaxSizeHitList=3" \
            "https://efa.vrr.de/standard/XML_DM_REQUEST?outputFormat=rapidJSON&type_dm=any&name_dm=K%C3%B6ln%20Neumarkt&mode=direct&useRealtime=1&limit=4" \
            "https://db.transport.rest/" \
            "https://v6.db.transport.rest.de/" ; do
            echo; echo "=== $u"; curl -sS -m 25 -D - -o body.txt -H 'Origin: https://froetom-crypto.github.io' -H 'user-agent: Mozilla/5.0' "$u" | grep -iE '^HTTP|access-control-allow-origin|content-type'; head -c 2500 body.txt; echo; done
          ID=$(curl -sS "https://api.transitous.org/api/v1/geocode?text=K%C3%B6ln%20Neumarkt" | python3 -c "import sys,json;d=json.load(sys.stdin);print([x for x in d if x.get('type')=='STOP'][0]['id'])" || true)
          echo "=== transitous stoptimes $ID"
          for v in v1 v4 v5; do curl -sS -m 25 -G "https://api.transitous.org/api/$v/stoptimes" --data-urlencode "stopId=$ID" --data-urlencode "n=6" --data-urlencode "time=$T" | head -c 3000; echo; done
