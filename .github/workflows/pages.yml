name: Webseite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: App-Dateien auf den Branch gh-pages legen (GitHub Pages veröffentlicht ihn)
        run: |
          mkdir site
          cp index.html styles.css stats.js app.js sw.js manifest.webmanifest icon.svg site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Webseite $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
      - name: Live-Seite und Statistik prüfen
        run: |
          sleep 60
          curl -sS -o /dev/null -w "Webseite: %{http_code}\n" https://froetom-crypto.github.io/Claude-Test/
          curl -sS -o /dev/null -w "Statistik: %{http_code}\n" https://raw.githubusercontent.com/froetom-crypto/Claude-Test/stats-data/stats.json
